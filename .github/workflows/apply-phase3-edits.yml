name: apply-phase3-edits

on:
  push:
    branches:
      - feat/phase3-studio-tools

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase3-studio-tools
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Apply Phase 3 source edits
        run: python scripts/apply_phase3_edits.py

      - name: Commit wired sources and remove one-shot patch files
        shell: bash
        run: |
          rm -f .github/workflows/apply-phase3-edits.yml scripts/apply_phase3_edits.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: wire resilient Mind Map and Studio UI"
          git push origin HEAD:feat/phase3-studio-tools
